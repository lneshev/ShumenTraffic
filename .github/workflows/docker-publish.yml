name: Build and Publish Docker Images

on:
  push:
    tags:
      - '*'

jobs:
  build-and-push-all:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    strategy:
      fail-fast: true # Stops the other if one fails
      matrix:
        include:
          - dockerfile_directory: ./Server/ShumenTraffic.Web.WebAPI
            image_suffix: webapi
          - dockerfile_directory: ./Client
            image_suffix: webapp

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Debug repo structure
        run: |
          pwd
          ls -la
          ls -la ${{ matrix.dockerfile_directory }}

      - name: Create Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/shumen-traffic-${{ matrix.image_suffix }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.dockerfile_directory }}
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    needs: build-and-push-all
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create Release
        run: gh release create ${{ github.ref_name }} --verify-tag --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}